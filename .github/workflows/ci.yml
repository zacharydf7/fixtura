name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Linux requires a SQL container, so a broken server fails CI; Windows uses LocalDB if present, else SQL tests skip.
      - name: Start SQL Server
        if: runner.os == 'Linux'
        run: |
          SQL_PASSWORD="Fx-$(openssl rand -hex 16)"
          echo "::add-mask::$SQL_PASSWORD"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for i in $(seq 1 30); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SQL_PASSWORD" -Q "SELECT 1"; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs sql; exit 1; fi
          echo "FIXTURA_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$SQL_PASSWORD;TrustServerCertificate=true" >> "$GITHUB_ENV"
          echo "FIXTURA_SQLSERVER_REQUIRED=true" >> "$GITHUB_ENV"
      # The test projects share one SQL Server, which creates databases one at a time: run together, they time out.
      - run: dotnet test -c Release --max-parallel-test-modules 1
      # Packing on every run, with package validation on, finds a packaging problem before a release does.
      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: packages
          path: artifacts/

  # The integration tests again, against the oldest Mvc.Testing Fixtura supports, as a project that installs only
  # Fixtura gets it.
  minimum-mvc-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Fixtura.Tests.Integration -c Release -p:UseMinimumMvcTesting=true

  # A version tag such as v0.1.0 publishes that version to nuget.org, once the tests pass on both systems.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, minimum-mvc-testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
